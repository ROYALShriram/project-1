                btn.onclick = () => selectOption(btn, opt);
                optionsContainer.appendChild(btn);

            Array.from(optionsContainer.children).forEach(b => b.disabled = true);
            feedbackBox.classList.remove('hidden');
            feedbackBox.innerText = option.reason;
            if(option.correct) {
                btn.className = 'w-full text-left p-4 rounded-xl text-sm font-medium border border-emerald-500/40 bg-emerald-500/10 text-emerald-400 flex justify-between items-center';

            nextBtn.classList.remove('hidden');
        }

        nextBtn.onclick = () => {

            if(currentIdx < quizData.length) {
                loadQuestion();
            } else {
                questionEl.innerText = 'Evaluation Completed!';
                optionsContainer.innerHTML = `<div class="text-center py-6 text-gray-400">You have successfully completed the chemical module. Share this code stack to GitHub to track continuous performance updates!</div>`;
                nextBtn.classList.add('hidden');

                progressText.innerText = 'Finished';
            }
        };

        loadQuestion();
    </script>
